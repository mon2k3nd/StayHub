name: stayhub_frontend
description: "StayHub - Ứng dụng quản lý nhà trọ phong cách iOS 26 Liquid Glass"
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^14.2.0
  dio: ^5.4.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  responsive_framework: ^1.4.0
  intl: ^0.19.0
  logger: ^2.3.0
  flutter_secure_storage: ^10.3.1
  google_fonts: ^6.2.1
  # Thêm lại các package cũ để tránh lỗi trong quá trình migration
  provider: ^6.1.1
  timeago: ^3.6.1
  fl_chart: ^1.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.3
  flutter_client_sse: ^2.0.3
  signature: ^6.3.0
  web_socket_channel: ^3.0.3
  flutter_image_compress: ^2.4.0
  smooth_page_indicator: ^2.0.1
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1
  camera: ^0.12.0+1
  confetti: ^0.8.0
  syncfusion_flutter_pdfviewer: ^33.2.10
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  firebase_auth: ^6.5.4
  flutter_local_notifications: ^22.0.1
  pdf: ^3.13.0
  printing: ^5.15.0
  syncfusion_flutter_xlsio: ^33.2.13+1
  path_provider: ^2.1.6
  open_file: ^4.0.0
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  shimmer: ^3.0.0
  local_auth: ^3.0.1
  dio_cache_interceptor: ^3.5.1
  dio_cache_interceptor_hive_store: ^4.0.0
  showcaseview: ^5.1.0
  shared_preferences: ^2.5.5
  flutter_staggered_animations: ^1.1.1
  google_generative_ai: ^0.4.7
  liquid_pull_to_refresh: ^3.0.1
  appinio_swiper: ^2.1.1
  screen_protector: ^1.5.2
  flutter_jailbreak_detection: ^1.10.0
  record: ^7.1.1
  audioplayers: ^6.1.0
  google_mlkit_text_recognition: ^0.16.0
  google_mlkit_barcode_scanning: ^0.15.0
  google_mlkit_face_detection: ^0.14.0
  pinput: ^6.0.2
  animate_do: ^5.1.0
  lottie: ^3.5.1
  google_sign_in: ^6.2.1
  flutter_map_marker_cluster: ^8.2.2
  image_cropper: ^12.2.1
  connectivity_plus: ^7.3.0
  chewie: ^1.14.1
  video_player: ^2.9.2
  crypto: ^3.0.7
  encrypt: ^5.0.3
  permission_handler: ^12.0.3
  palette_generator: ^0.3.3+7
  cached_network_image: ^3.4.1
  sensors_plus: ^7.1.0
  flutter_facebook_auth: ^7.2.0
  sign_in_with_apple: ^6.1.4
  app_links: ^6.3.2
  http: ^1.6.0
  model_viewer_plus: ^1.10.0
  liquid_glass_widgets: ^1.6.0
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/sounds/
    - assets/images/
    - assets/images/logo/
    - assets/images/categories/
    - assets/images/features/
    - assets/images/features/grid_icons.png
    - assets/images/features/split_icons/
    - assets/images/features/new_icons/
  fonts:
    - family: CustomRoboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/logo-stayhub-khong-nen.png"

# Force asset rebuild
